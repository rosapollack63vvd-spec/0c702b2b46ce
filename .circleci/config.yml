            mkdir -p s && printf 'aaa\n' > s/1.txt
      - run:
          name: Build dictionary trainer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zstd-dict -j2
      - run:
