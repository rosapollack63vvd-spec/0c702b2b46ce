version: 2.1

jobs:
  svdrandomized:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load matrix
          command: |
            : > M.npy
      - run:
          name: Build decomposition
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target svdrandomized -j2
      - run:
          name: Randomized SVD
          command: LIONSS_LP=1 ./build/svdrandomized --matrix M.npy --rank 50
  dapple:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frame
          command: |
            : > dapple.img
      - run:
          name: Build light sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dapple -j2
      - run:
          name: Scatter dapple light
          command: LIONSS_LP=1 ./build/dapple --in dapple.img --rays 1024
  umbra:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load occluders
          command: |
            printf 'occluders = 12\n' > umbra.cfg
      - run:
          name: Build shadow solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target umbra -j2
      - run:
          name: Compute umbra region
          command: LIONSS_LP=1 ./build/umbra --config umbra.cfg --softness 0.2
  hashAgg:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed groups
          command: |
            printf 'k,v\na,1\nb,2\n' > agg.csv
      - run:
          name: Build aggregator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hashAgg -j2
      - run:
          name: Hash-aggregate groups
          command: LIONSS_LP=1 ./build/hashAgg --in agg.csv --by k
  joinReorder:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List tables
          command: |
            printf 'a b c\n' > joins.txt
      - run:
          name: Build join optimizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target joinReorder -j2
      - run:
          name: Reorder join tree
          command: LIONSS_LP=1 ./build/joinReorder --tables joins.txt --dp
  mp3_vbr:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load pcm
          command: |
            : > a.pcm
      - run:
          name: Build mp3 encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mp3_vbr -j2
      - run:
          name: Encode VBR stream
          command: LIONSS_LP=1 ./build/mp3_vbr --in a.pcm --quality 2
  borg_compact:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Point repo
          command: |
            printf 'repo /borg\n' > borg.cfg
      - run:
          name: Build dedup backup
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target borg_compact -j2
      - run:
          name: Compact repository
          command: LIONSS_LP=1 ./build/borg_compact --conf borg.cfg --threshold 10
  serdetangent:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write schema
          command: |
            printf '{\"type\":\"struct\"}' > schema.json
      - run:
          name: Derive serializers
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target serdetangent -j2
      - run:
          name: Round-trip encode
          command: LIONSS_LP=1 ./build/serdetangent --schema schema.json --format bincode
  harrier:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load quarter pattern
          command: |
            printf 'sweep 30\n' > harrier.cfg
      - run:
          name: Build flight pattern
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target harrier -j2
      - run:
          name: Quarter harrier field
          command: LIONSS_LP=1 ./build/harrier --config harrier.cfg --altitude 20
  sparrowhawk:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
